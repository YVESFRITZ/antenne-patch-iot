[build]
  command = "npm run build"
  # Le plugin Next.js v5 attend le dossier de sortie de Next.
  # Sans cette ligne, "publish" vaut la racine du depot et le build
  # echoue : "publish directory cannot be the same as the base directory".
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY = "AIzaSyB0zcm-6bLyktc7syhI8fWyFE_pMOfoSI0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

